<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Prog wejscia">
<defs>
  <pattern id="g" width="80" height="80" patternUnits="userSpaceOnUse">
    <circle cx="40" cy="40" r="3.2" fill="none" stroke="#2656d9" stroke-opacity="0.15" stroke-width="1.1"/>
  </pattern>
  <marker id="a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M 1 1 L 11 6 L 1 11 z" fill="#2656d9"/>
  </marker>
</defs>
<style>
  .flow{stroke-dasharray:8 10;animation:f 1.7s linear infinite}
  @keyframes f{to{stroke-dashoffset:-36}}
  .breathe{animation:b 4s ease-in-out infinite}
  @keyframes b{0%,100%{fill-opacity:.10}50%{fill-opacity:.20}}
  @media (prefers-reduced-motion: reduce){
    .flow,.breathe{animation:none}
    .mover{display:none}
  }
</style>
<rect width="1600" height="900" fill="#FCFBFA"/>
<rect width="1600" height="900" fill="url(#g)"/>
<rect x="150" y="150" width="620" height="120" fill="none" stroke="#2656d9" stroke-width="2"/>
<text x="460.0" y="204.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#2656d9" text-anchor="middle" font-weight="400" letter-spacing="0.08em">USTAW POBIERANIE NA 4</text>
<text x="460.0" y="236.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9A9895" text-anchor="middle" font-weight="400" letter-spacing="0.1em">RZADKIE SŁOWO - KONKRET - 62 ZNAKI</text>
<rect x="150" y="300" width="620" height="120" fill="none" stroke="#2656d9" stroke-width="2"/>
<text x="460.0" y="354.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#2656d9" text-anchor="middle" font-weight="400" letter-spacing="0.08em">ZEBRAŁEM TO W JEDNO MIEJSCE...</text>
<text x="460.0" y="386.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9A9895" text-anchor="middle" font-weight="400" letter-spacing="0.1em">PONAD 200 ZNAKÓW - REAKCJA POD SPODEM</text>
<path d="M 770 210 L 850 210 L 850 360 L 770 360" fill="none" stroke="#2656d9" stroke-width="2"/>
<path class="flow" d="M 850 285 L 990 285" fill="none" stroke="#2656d9" stroke-width="2" marker-end="url(#a)"/>
<circle class="mover" r="6" fill="#2656d9" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion dur="2.8s" begin="0s" repeatCount="indefinite" path="M 770 210 L 850 210 L 850 285 L 990 285"/></circle>
<rect class="breathe" x="990" y="220" width="460" height="130" fill="#2656d9" fill-opacity="0.14"/>
<rect x="990" y="220" width="460" height="130" fill="none" stroke="#2656d9" stroke-width="2"/>
<text x="1220.0" y="279.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#2656d9" text-anchor="middle" font-weight="400" letter-spacing="0.08em">WCHODZI DO BAZY</text>
<text x="1220.0" y="311.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9A9895" text-anchor="middle" font-weight="400" letter-spacing="0.1em">ZDAJE PRZYNAJMNIEJ JEDEN TEST</text>
<rect x="150" y="500" width="620" height="120" fill="none" stroke="#2656d9" stroke-width="2"/>
<text x="460.0" y="554.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#2656d9" text-anchor="middle" font-weight="400" letter-spacing="0.08em">NO DOBRA, SPOKO</text>
<text x="460.0" y="586.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9A9895" text-anchor="middle" font-weight="400" letter-spacing="0.1em">KRÓTKIE - POSPOLITE SŁOWA - BEZ REAKCJI</text>
<path d="M 770 560 L 990 560" fill="none" stroke="#2656d9" stroke-width="2" marker-end="url(#a)"/>
<rect x="990" y="495" width="460" height="130" fill="none" stroke="#2656d9" stroke-width="2"/>
<text x="1220.0" y="554.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#2656d9" text-anchor="middle" font-weight="400" letter-spacing="0.08em">ODPADA</text>
<text x="1220.0" y="586.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9A9895" text-anchor="middle" font-weight="400" letter-spacing="0.1em">ZERO Z TRZECH TESTÓW</text>
<text x="150" y="700" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#2656d9" text-anchor="start" font-weight="400" letter-spacing="0.09em">TRZY TESTY, WYSTARCZY JEDEN</text>
<text x="150" y="730" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9A9895" text-anchor="start" font-weight="400" letter-spacing="0.1em">RZADKIE SŁOWO - 200 ZNAKÓW - REAKCJA</text>
<text x="150" y="810" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9A9895" text-anchor="start" font-weight="400" letter-spacing="0.12em">PRÓG STOI PRZED WYCIĄGIEM. INACZEJ PŁACISZ ZA MIELENIE POTWIERDZEŃ</text>
</svg>
