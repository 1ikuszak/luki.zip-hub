<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Laczenie list">
<defs>
  <pattern id="g" width="80" height="80" patternUnits="userSpaceOnUse">
    <circle cx="40" cy="40" r="3.2" fill="none" stroke="#2656d9" stroke-opacity="0.15" stroke-width="1.1"/>
  </pattern>
  <marker id="a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M 1 1 L 11 6 L 1 11 z" fill="#2656d9"/>
  </marker>
</defs>
<style>
  .flow{stroke-dasharray:8 10;animation:f 1.7s linear infinite}
  @keyframes f{to{stroke-dashoffset:-36}}
  .breathe{animation:b 4s ease-in-out infinite}
  @keyframes b{0%,100%{fill-opacity:.10}50%{fill-opacity:.20}}
  @media (prefers-reduced-motion: reduce){
    .flow,.breathe{animation:none}
    .mover{display:none}
  }
</style>
<rect width="1600" height="900" fill="#FCFBFA"/>
<rect width="1600" height="900" fill="url(#g)"/>
<rect x="120" y="170" width="480" height="130" fill="none" stroke="#2656d9" stroke-width="2"/>
<text x="360.0" y="229.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#2656d9" text-anchor="middle" font-weight="400" letter-spacing="0.08em">DOKŁADNY TEKST</text>
<text x="360.0" y="261.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9A9895" text-anchor="middle" font-weight="400" letter-spacing="0.1em">TEN WĄTEK NA 1. MIEJSCU</text>
<rect x="120" y="350" width="480" height="130" fill="none" stroke="#2656d9" stroke-width="2"/>
<text x="360.0" y="409.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#2656d9" text-anchor="middle" font-weight="400" letter-spacing="0.08em">ZNACZENIE</text>
<text x="360.0" y="441.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9A9895" text-anchor="middle" font-weight="400" letter-spacing="0.1em">TEN WĄTEK NA 2. MIEJSCU</text>
<rect x="120" y="530" width="480" height="130" fill="none" stroke="#2656d9" stroke-width="2"/>
<text x="360.0" y="589.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#2656d9" text-anchor="middle" font-weight="400" letter-spacing="0.08em">RZADKIE SŁOWO</text>
<text x="360.0" y="621.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9A9895" text-anchor="middle" font-weight="400" letter-spacing="0.1em">TEN WĄTEK NA 2. MIEJSCU</text>
<path d="M 600 235 L 700 235 L 700 605 L 600 605" fill="none" stroke="#2656d9" stroke-width="2"/>
<path class="flow" d="M 700 420 L 840 420" fill="none" stroke="#2656d9" stroke-width="2" marker-end="url(#a)"/>
<circle class="mover" r="6" fill="#2656d9" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion dur="3.0s" begin="0s" repeatCount="indefinite" path="M 600 235 L 700 235 L 700 420 L 840 420"/></circle>
<circle class="mover" r="6" fill="#2656d9" opacity="0"><set attributeName="opacity" to="1" begin="1.5s"/><animateMotion dur="3.0s" begin="1.5s" repeatCount="indefinite" path="M 600 605 L 700 605 L 700 420 L 840 420"/></circle>
<rect class="breathe" x="840" y="355" width="520" height="130" fill="#2656d9" fill-opacity="0.14"/>
<rect x="840" y="355" width="520" height="130" fill="none" stroke="#2656d9" stroke-width="2"/>
<text x="1100.0" y="414.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="22" fill="#2656d9" text-anchor="middle" font-weight="400" letter-spacing="0.08em">JEDNA LISTA</text>
<text x="1100.0" y="446.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9A9895" text-anchor="middle" font-weight="400" letter-spacing="0.1em">SUMUJESZ MIEJSCA, NIE OCENY</text>
<text x="840" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#2656d9" text-anchor="start" font-weight="400" letter-spacing="0.09em">WZOR</text>
<text x="840" y="590" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9A9895" text-anchor="start" font-weight="400" letter-spacing="0.1em">WAGA / (60 + POZYCJA)</text>
<text x="840" y="660" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#2656d9" text-anchor="start" font-weight="400" letter-spacing="0.09em">DLACZEGO 60</text>
<text x="840" y="690" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9A9895" text-anchor="start" font-weight="400" letter-spacing="0.1em">ŻEBY ZGODNOSC BIŁA JEDEN MOCNY GŁOS</text>
<text x="120" y="810" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9A9895" text-anchor="start" font-weight="400" letter-spacing="0.12em">DOKUMENT WYSOKI U WSZYSTKICH TRZECH BIJE TEGO, KTÓRY JEST PIERWSZY U JEDNEJ</text>
</svg>
