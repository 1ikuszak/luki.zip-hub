<rect x="150" y="280" width="340" height="88" fill="none" stroke="#2656d9" stroke-width="2"/>
<text x="320.0" y="331.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#2656d9" text-anchor="middle" font-weight="400" letter-spacing="0.08em">DYSK I DOKUMENTY</text>
<rect x="150" y="400" width="340" height="88" fill="none" stroke="#2656d9" stroke-width="2"/>
<text x="320.0" y="451.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#2656d9" text-anchor="middle" font-weight="400" letter-spacing="0.08em">SKRZYNKA MAILOWA</text>
<rect x="150" y="520" width="340" height="88" fill="none" stroke="#2656d9" stroke-width="2"/>
<text x="320.0" y="571.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#2656d9" text-anchor="middle" font-weight="400" letter-spacing="0.08em">SYSTEM ZGŁOSZEŃ</text>
<rect x="150" y="640" width="340" height="88" fill="none" stroke="#2656d9" stroke-width="2"/>
<text x="320.0" y="691.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#2656d9" text-anchor="middle" font-weight="400" letter-spacing="0.08em">WŁASNE BAZY</text>
<path d="M 490 204 L 560 204 L 560 684 L 490 684" fill="none" stroke="#2656d9" stroke-width="2"/>
<path class="flow" d="M 560 444 L 700 444" fill="none" stroke="#2656d9" stroke-width="2" marker-end="url(#a)"/>
<circle class="mover" r="6" fill="#2656d9" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion dur="3.2s" begin="0s" repeatCount="indefinite" path="M 490 204 L 560 204 L 560 444 L 700 444"/></circle>
<circle class="mover" r="6" fill="#2656d9" opacity="0"><set attributeName="opacity" to="1" begin="1.6s"/><animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M 490 684 L 560 684 L 560 444 L 700 444"/></circle>
<text x="150" y="790" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9A9895" text-anchor="start" font-weight="400" letter-spacing="0.12em">JEDEN ŁĄCZNIK NA ŹRÓDŁO</text>
<rect class="breathe" x="700" y="380" width="420" height="128" fill="#2656d9" fill-opacity="0.14"/>
<rect x="700" y="380" width="420" height="128" fill="none" stroke="#2656d9" stroke-width="2"/>
