<text x="910.0" y="470.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9A9895" text-anchor="middle" font-weight="400" letter-spacing="0.1em">TREŚĆ - WEKTOR - SKĄD - KTO WIDZI</text>
<text x="700" y="550" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9A9895" text-anchor="start" font-weight="400" letter-spacing="0.12em">TEN SAM KSZTAŁT WIERSZA, ZAWSZE</text>
