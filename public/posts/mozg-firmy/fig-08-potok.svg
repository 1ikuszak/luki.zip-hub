<text x="1480.0" y="486.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9A9895" text-anchor="middle" font-weight="400" letter-spacing="0.1em">Z LINKIEM</text>
<text x="80" y="620" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9A9895" text-anchor="start" font-weight="400" letter-spacing="0.12em">PLANISTA NIE WIDZI TREŚCI, WIEC NIE MA CZEGO ZMYŚLIĆ</text>
<text x="80" y="660" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9A9895" text-anchor="start" font-weight="400" letter-spacing="0.12em">GDY NIC NIE PASUJE, ODPOWIEDŹ BRZMI: NIE MA TEGO W BAZIE</text>
<text x="80" y="810" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9A9895" text-anchor="start" font-weight="400" letter-spacing="0.12em">KROKI SĄ OSOBNE PO TO, ŻEBY BYŁO WIDAĆ, KTÓRY SIĘ ZEPSUŁ</text>
